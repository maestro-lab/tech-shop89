---
- summary: |
    Проверка добавления товара в корзину из каталога
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину.
  prerequisites: |
    Открыта главная страница магазина https://hexlet.app
  test-data: |
    Любой товар из списка (например, "Смартфон")
  steps:
    - Найти товар в каталоге
    - Нажать кнопку "В корзину" на карточке товара
    - Обратить внимание на иконку корзины в шапке сайта
  expected-result: |
    Товар успешно добавлен. На иконке корзины счетчик увеличился на 1. Страница не перезагрузилась.

- summary: |
    Проверка фильтрации товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары.
  prerequisites: |
    Открыта главная страница магазина
  test-data: |
    Категория = "Электроника"
  steps:
    - Перейти в блок фильтров
    - Выбрать категорию "Электроника"
    - Нажать кнопку "Применить" (или дождаться автофильтрации)
  expected-result: |
    В каталоге отображаются только товары, принадлежащие к категории "Электроника".

- summary: |
    Проверка удаления товара из корзины
  requirement: |
    На странице корзины пользователь cможет удалить товар из корзины.
  prerequisites: |
    В корзину добавлен минимум один товар. Открыта страница корзины.
  test-data: |
    Товар в корзине
  steps:
    - Нажать на кнопку удаления (иконка корзины / крестик) напротив товара
  expected-result: |
    Товар исчезает из списка в корзине. Итоговая сумма пересчитывается. Счетчик в шапке уменьшается.
