
---

- summary: |
    [P2] Выбранный язык не сохраняется после обновления страницы
  environment: |
    Браузер и ОС: указать фактические версии
    Версия приложения: products-store.hexlet.app
  steps-to-reproduce: |
    1. Открыть магазин.
    2. Выбрать другой язык.
    3. Обновить страницу.
  expected-result: |
    Выбранный язык сохраняется после обновления.
  actual-result: |
    После обновления язык интерфейса меняется автоматически.

- summary: |
    [P2] Список производителей не обновляется при выборе категории
  environment: |
    Браузер и ОС: указать фактические версии
    Версия приложения: products-store.hexlet.app
  steps-to-reproduce: |
    1. Открыть каталог.
    2. Выбрать категорию товаров.
    3. Проверить список производителей.
  expected-result: |
    Список производителей соответствует выбранной категории.
  actual-result: |
    Список производителей не меняется вместе с категорией.

- summary: |
    [P2/P3] Информация о товаре не переводится при смене языка
  environment: |
    Браузер и ОС: указать фактические версии
    Версия приложения: products-store.hexlet.app
  steps-to-reproduce: |
    1. Открыть карточку товара.
    2. Переключить язык интерфейса.
    3. Проверить описание и характеристики товара.
  expected-result: |
    Переводимые элементы информации о товаре
    отображаются на выбранном языке.
  actual-result: |
    Часть информации о товаре остаётся на прежнем языке.

- summary: |
    [P3] Отсутствуют иконки переключения языка
  environment: |
    Браузер и ОС: указать фактические версии
    Версия приложения: products-store.hexlet.app
  steps-to-reproduce: |
    1. Открыть главную страницу магазина.
    2. Найти переключатель языка.
  expected-result: |
    Переключатель соответствует предусмотренному дизайну.
  actual-result: |
    Иконки языков отсутствуют.
