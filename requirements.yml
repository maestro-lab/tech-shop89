
---
требование к сайту
functional:
  - Пользователь может искать товары по ключевому слову.
  - Пользователь может выбирать категорию товаров.
  - Пользователь может фильтровать товары.
  - Пользователь может просматривать каталог товаров.
  - Пользователь может просматривать подробную информацию о товаре.
  - В каталоге и карточке товара отображаются название, рейтинг, цена со скидкой и исходная цена.
  - Пользователь может добавлять товары в корзину.
  - Пользователь может просматривать содержимое корзины.
  - Пользователь может удалять товары из корзины.
  - Пользователь может продолжать покупки из корзины.
  - Пользователь может оформить заказ и перейти к оплате.
  - Пользователь может переключать язык интерфейса.
  - Интерфейс доступен на русском и английском языках.

non-functional:
  - Интерфейс отностельно адаптируется к мобильным устройствам.
  - Сайт обеспечивает удобство использования.
  - Сайт оптимизирован по скорости работы.
  - Сайт совместим с актуальными версиями популярных браузеров.
  - Сайт доступен на различных устройствах.
  - Сайт доступен напрямую из интернета без необходимости использования VPN.

